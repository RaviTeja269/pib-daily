<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIB Exam Daily</title>
  <meta name="description" content="Each day's Press Information Bureau releases, sorted into read first, read next, skim and skip for UPSC and APPSC Group 1 and 2 preparation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2316213a' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffd84d'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <h1>PIB Exam Daily</h1>
      <nav aria-label="Pages">
        <a href="./" aria-current="page">Releases</a>
        <a href="guide.html">How to read PIB</a>
      </nav>
    </div>

    <div class="days" id="days" role="group" aria-label="Choose a day"></div>

    <div class="controls">
      <div class="search">
        <label class="sr" for="q">Search releases</label>
        <input id="q" type="search" placeholder="Search the last 30 days" autocomplete="off">
      </div>

      <div class="row">
        <div class="seg" id="rangeSeg" role="group" aria-label="Range">
          <button type="button" data-range="day" aria-pressed="true">Day</button>
          <button type="button" data-range="week" aria-pressed="false">7 days</button>
          <button type="button" data-range="month" aria-pressed="false">30 days</button>
          <button type="button" data-range="saved" aria-pressed="false">Saved <span id="savedCount"></span></button>
        </div>
      </div>

      <div class="row">
        <label for="lensSeg">Prepare for</label>
        <div class="seg" id="lensSeg" role="group" aria-label="Exam focus">
          <button type="button" data-lens="all" aria-pressed="true">Both</button>
          <button type="button" data-lens="upsc" aria-pressed="false">UPSC</button>
          <button type="button" data-lens="appsc" aria-pressed="false">APPSC</button>
        </div>
      </div>

      <label class="check"><input type="checkbox" id="apOnly"> Only Andhra Pradesh items</label>

      <details class="more">
        <summary>More filters</summary>
        <div class="row" style="margin-bottom:10px">
          <label for="ministry">Ministry</label>
          <select id="ministry"><option value="">All ministries</option></select>
        </div>
        <div class="chips" id="subjectChips" aria-label="Subjects"></div>
        <p style="margin:10px 0 0"><label class="check"><input type="checkbox" id="showSkip"> Expand the skip list</label></p>
      </details>
    </div>
  </aside>

  <main class="main" id="main" aria-live="polite">
    <p class="empty">Loading releases…</p>
  </main>
</div>
<noscript><p style="padding:16px">This page needs JavaScript to show the daily releases.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
